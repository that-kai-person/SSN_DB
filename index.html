<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kai's Serial Number Locator</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1>Serial Number Locator</h1>

<input
id="serial"
type="text"
placeholder="Enter serial number"
autocapitalize="characters"
autocomplete="off"
spellcheck="false">

<button id="searchButton">

Search

</button>

<div id="result">

Load a CSV and search.

</div>

</div>

<script src="script.js"></script>

</body>

</html>
